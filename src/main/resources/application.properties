spring.application.name=hibernate-practical

spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Outbound (secured) external book service.
# The token is read from the EXTERNAL_API_TOKEN environment variable (credential kept
# outside source code); the value here is only a non-secret fallback for local demos.
external.api.base-url=https://external-api.acnbootcamp.lv/api
external.api.token=${EXTERNAL_API_TOKEN:demo-token-not-a-real-secret}